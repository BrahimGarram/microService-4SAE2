security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        keycloak_users:
            id: App\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        collaboration_health:
            pattern: ^/api/health$
            security: false
        collaboration_public:
            pattern: ^/api/collaborations/public
            security: false
        collaboration_media:
            pattern: ^/api/collaborations/media/
            security: false
        main:
            pattern: ^/api
            lazy: true
            stateless: true
            provider: keycloak_users
            custom_authenticators:
                - App\Security\KeycloakJwtAuthenticator

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/collaborations/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/collaborations/media/, roles: PUBLIC_ACCESS }
        - { path: ^/api/collaborations/preview/, allow_if: "is_granted('ROLE_ADMIN')" }
        - { path: ^/api/collaborations/pending, roles: ROLE_ADMIN }
        - { path: ^/api/collaborations/[^/]+/approve, methods: [PATCH], roles: ROLE_ADMIN }
        - { path: ^/api/collaborations/[^/]+/reject, methods: [PATCH], roles: ROLE_ADMIN }
        - { path: ^/api/collaborations/mine, allow_if: "is_granted('ROLE_COLLABORATEUR') or is_granted('ROLE_ADMIN')" }
        - { path: ^/api/collaborations$, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/collaborations$, methods: [POST], allow_if: "is_granted('ROLE_COLLABORATEUR') or is_granted('ROLE_ADMIN')" }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
