# Profil docker — SPRING_PROFILES_ACTIVE=docker
spring.config.activate.on-profile=docker
spring.datasource.url=jdbc:mysql://mysql:3306/freelancify?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=complaints-service
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
