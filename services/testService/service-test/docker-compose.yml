services:
  mysql:
    image: mysql:8.0
    container_name: service-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freelancify
    ports:
      # 3307 sur l’hôte pour éviter le conflit avec un MySQL local sur 3306
      - "3307:3306"
    volumes:
      - service-test-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  service-test:
    build: .
    container_name: service-test-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Accès depuis la machine : http://localhost:9099/service-test/...
      - "9099:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/freelancify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # Sans Eureka dans ce compose : évite les erreurs si le registre n’est pas démarré
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      # Appels Feign vers user-service sur la machine hôte (API Gateway / backend local)
      USER_SERVICE_URL: http://host.docker.internal:8081

volumes:
  service-test-mysql-data:
