# Profil docker — activé par SPRING_PROFILES_ACTIVE=docker (docker-compose).
# Ne modifie pas le comportement local (sans ce profil).
spring.config.activate.on-profile=docker
spring.datasource.url=jdbc:mysql://mysql:3306/freelance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
server.port=8082
# Ollama sur la machine hôte (optionnel) — sinon l’IA draft peut échouer dans le conteneur
ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
