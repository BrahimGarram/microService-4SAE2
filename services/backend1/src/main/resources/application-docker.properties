# Active avec SPRING_PROFILES_ACTIVE=docker (docker-compose racine)
# JWT : meme hote que Keycloak dans le reseau Docker (voir docker-compose.yml)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/projetpidev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/projetpidev/protocol/openid-connect/certs

keycloak.admin.url=http://keycloak:8080
app.base.url=http://user-service:8081
