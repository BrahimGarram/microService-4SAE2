# Active avec SPRING_PROFILES_ACTIVE=docker (docker-compose racine)
# Eureka : nom DNS du conteneur sur le réseau Compose (pas localhost)
eureka.instance.hostname=user-service
eureka.instance.prefer-ip-address=true
# JWT : JWK depuis Keycloak interne ; plusieurs iss acceptes (navigateur localhost:8180 vs reseau Docker).
# Voir DockerResourceServerJwtConfig (pas d'issuer-uri unique, sinon 401 sur les tokens emis pour le front).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/projetpidev/protocol/openid-connect/certs
app.security.jwt.trusted-issuers=http://localhost:8180/realms/projetpidev,http://127.0.0.1:8180/realms/projetpidev,http://keycloak:8080/realms/projetpidev

keycloak.admin.url=http://keycloak:8080
app.base.url=http://user-service:8081

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
