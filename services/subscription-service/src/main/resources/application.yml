spring:
  application:
    name: subscription-service

  datasource:
    url: jdbc:h2:mem:freelancify-subscriptions;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Enable scheduling for subscription renewal and expiration checks
  task:
    scheduling:
      enabled: true

  web:
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://localhost:8080"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8091

app:
  payment:
    webhook-secret: your-webhook-secret-here
  frontend:
    url: http://localhost:4200

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.example.subscriptionservice: DEBUG
