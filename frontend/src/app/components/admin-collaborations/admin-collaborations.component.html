<div class="admin-collab">
  <h1>Collaborations — validation</h1>
  <p class="sub">Approuvez ou refusez les publicités soumises par les comptes collaborateur.</p>

  <div *ngIf="loading" class="muted">Chargement…</div>

  <div *ngIf="!loading && pending.length === 0" class="muted">Aucune demande en attente.</div>

  <table *ngIf="!loading && pending.length" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Utilisateur</th>
        <th>Type</th>
        <th>Priorité</th>
        <th>Aperçu</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pending">
        <td>{{ p.id }}</td>
        <td>{{ p.userName || '—' }}</td>
        <td>{{ p.type }}</td>
        <td>{{ p.priority }}</td>
        <td class="preview">
          <img *ngIf="p.type === 'IMAGE' && mediaUrl(p)" [src]="mediaUrl(p)" alt="" />
          <video *ngIf="p.type === 'VIDEO' && mediaUrl(p)" [src]="mediaUrl(p)" controls muted playsinline></video>
          <span *ngIf="!mediaUrl(p)" class="muted">…</span>
        </td>
        <td class="actions">
          <button type="button" class="btn-ok" (click)="approve(p.id)">Approuver</button>
          <button type="button" class="btn-no" (click)="reject(p.id)">Refuser</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
