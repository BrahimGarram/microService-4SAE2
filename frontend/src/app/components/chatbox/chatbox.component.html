<!-- Floating chat button + panel (only when logged in) -->
<ng-container *ngIf="isLoggedIn">
  <div class="chatbox-wrapper">
    <!-- Panel -->
    <div class="chat-panel" [class.open]="isOpen">
      <div class="chat-header">
        <span class="chat-title"><i class="fas fa-robot"></i> Freelancify Assistant</span>
        <button type="button" class="btn-close-panel" (click)="close()" aria-label="Fermer">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="chat-messages" #messagesContainer>
        <div *ngIf="messages.length === 0 && !loading" class="welcome">
          <p>Bonjour ! Je suis l'assistant Freelancify.</p>
          <p>Posez-moi des questions sur les projets, les propositions, la messagerie ou l'utilisation de la plateforme.</p>
        </div>
        <div *ngFor="let msg of messages" class="message" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
          <div class="message-content">
            <span class="message-text">{{ msg.content }}</span>
          </div>
        </div>
        <div *ngIf="loading" class="message assistant typing">
          <div class="message-content">
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea
          [(ngModel)]="inputText"
          placeholder="Écrivez votre message..."
          rows="2"
          (keydown)="onKeyDown($event)"
          [disabled]="loading"
          class="chat-input"></textarea>
        <button type="button" class="btn-send" (click)="send()" [disabled]="loading || !inputText?.trim()">
          <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
          <i class="fas fa-paper-plane" *ngIf="!loading"></i>
          Envoyer
        </button>
      </div>
    </div>

    <!-- Toggle button -->
    <button type="button" class="chat-toggle" (click)="toggle()" [class.open]="isOpen" aria-label="Ouvrir l'assistant">
      <i class="fas fa-comments" *ngIf="!isOpen"></i>
      <i class="fas fa-times" *ngIf="isOpen"></i>
    </button>
  </div>
</ng-container>
