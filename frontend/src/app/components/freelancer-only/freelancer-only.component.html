<div class="freelancer-only-page">
  <div class="freelancer-only-card">
    <div class="icon-wrapper">
      <i class="fas fa-user-lock"></i>
    </div>
    <h1>Freelancers only</h1>
    <p class="lead">
      This section is reserved for members registered as <strong>freelancers</strong>.
      Qualification tests are used to assess your skills and validate your profile on the platform.
    </p>
    <p class="sub">
      If you want to access this area, please create a freelancer account or contact the team to update your profile.
    </p>
    <div class="actions">
      <button type="button" class="btn-primary" (click)="goToProfile()">
        <i class="fas fa-user"></i> My profile
      </button>
      <button type="button" class="btn-secondary" (click)="goToHome()">
        <i class="fas fa-home"></i> Back to home
      </button>
    </div>
  </div>
</div>
