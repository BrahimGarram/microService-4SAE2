apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices

resources:
  - ../base/namespace.yaml
  - ../base/eureka-deployment.yaml
  - ../base/mysql-deployment.yaml
  - ../base/rabbitmq-deployment.yaml
  - ../base/user-service-deployment.yaml
  - ../base/api-gateway-deployment.yaml

replicas:
  - name: user-service
    count: 1
  - name: api-gateway
    count: 1

commonLabels:
  environment: dev
