apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: brahim2002/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka"
        - name: GATEWAY_USER_SERVICE_URI
          value: "http://user-service:8081"
        - name: GATEWAY_SERVICE_TEST_URI
          value: "http://service-test:8089"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: microservices
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8090
    targetPort: 8090
