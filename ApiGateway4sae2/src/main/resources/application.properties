spring.application.name=Api_GateAway
server.port=8090

# Eureka : Spring Boot 3 mappe surtout EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE (avec _URL_).
# docker-compose utilise souvent EUREKA_CLIENT_SERVICEURL_DEFAULTZONE — on accepte les deux.
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}}

# Tous les appels du frontend Angular passent par ce port (apiGatewayUrl).
# Routes -> services : user (USER-SERVICE), project (PROJECT-SERVICE),
# complaints (FREELANCE-PLATFORM-SPRING-APP, context-path /freelancity),
# service-test (SERVICE-TEST, context-path /service-test voir application.properties du service-test).

# Docker Compose : URIs directes sur le réseau interne (sans dépendre d'Eureka pour le routage).
gateway.user-service.uri=${GATEWAY_USER_SERVICE_URI:lb://USER-SERVICE}
gateway.service-test.uri=${GATEWAY_SERVICE_TEST_URI:lb://SERVICE-TEST}
# Collaboration = Symfony (PHP) : pas Eureka — URI HTTP directe.
# Dev local : Symfony CLI (symfony server) ou .symfony.local.yaml → :8888 ; Docker Compose (hôte) → :8888. Surcharge : GATEWAY_COLLABORATION_URI.
gateway.collaboration.uri=${GATEWAY_COLLABORATION_URI:http://localhost:8888}
# Project : dev local sans Eureka sur project-service → URI directe (sinon lb:// → 503).
# Docker Compose surcharge : GATEWAY_PROJECT_SERVICE_URI=http://project-service:8082
gateway.project-service.uri=${GATEWAY_PROJECT_SERVICE_URI:http://localhost:8082}
# Complaints : même logique (service sur 8092 en local).
# Docker : GATEWAY_COMPLAINTS_URI=http://complaints-service:8092
gateway.complaints.uri=${GATEWAY_COMPLAINTS_URI:http://localhost:8092}
# Subscription service
gateway.subscription.uri=${GATEWAY_SUBSCRIPTION_URI:lb://SUBSCRIPTION-SERVICE}

spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8987
