spring.application.name=API-GATEWAY
server.port=8090

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=true

# Tous les appels du frontend Angular passent par ce port (apiGatewayUrl).
# Routes -> services : user (USER-SERVICE), project (PROJECT-SERVICE),
# complaints (FREELANCE-PLATFORM-SPRING-APP, context-path /freelancity),
# service-test (SERVICE-TEST, context-path /service-test voir application.properties du service-test).

# Docker Compose : URIs directes sur le réseau interne (sans dépendre d'Eureka pour le routage).
gateway.user-service.uri=${GATEWAY_USER_SERVICE_URI:lb://USER-SERVICE}
gateway.service-test.uri=${GATEWAY_SERVICE_TEST_URI:lb://SERVICE-TEST}
# Collaboration = Symfony (PHP) : pas Eureka — URI HTTP directe.
# Dev local : Symfony CLI (symfony server) ou .symfony.local.yaml → :8888 ; Docker Compose (hôte) → :8888. Surcharge : GATEWAY_COLLABORATION_URI.
gateway.collaboration.uri=${GATEWAY_COLLABORATION_URI:http://localhost:8888}
