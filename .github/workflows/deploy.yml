name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USER: brahim2002

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: eureka
            context: ./Eureka
          - name: user-service
            context: ./services/backend1
          - name: api-gateway
            context: ./ApiGateway4sae2
          - name: complaints-service
            context: ./services/complaints-service
          - name: project-service
            context: ./services/project-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests - User Service
        run: |
          cd services/backend1
          mvn clean test

  deploy-dev:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: http://dev.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy to Dev
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -k k8s/dev/
          kubectl set image deployment/user-service user-service=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/user-service:${{ github.sha }} -n microservices
          kubectl set image deployment/api-gateway api-gateway=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/api-gateway:${{ github.sha }} -n microservices
          kubectl rollout status deployment/user-service -n microservices --timeout=5m
          kubectl rollout status deployment/api-gateway -n microservices --timeout=5m

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: http://staging.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Staging
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -k k8s/staging/
          kubectl set image deployment/user-service user-service=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/user-service:${{ github.sha }} -n microservices
          kubectl set image deployment/api-gateway api-gateway=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/api-gateway:${{ github.sha }} -n microservices
          kubectl rollout status deployment/user-service -n microservices --timeout=5m
          kubectl rollout status deployment/api-gateway -n microservices --timeout=5m

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: http://prod.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy to Production
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -k k8s/prod/
          kubectl set image deployment/user-service user-service=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/user-service:${{ github.sha }} -n microservices
          kubectl set image deployment/api-gateway api-gateway=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USER }}/api-gateway:${{ github.sha }} -n microservices
          kubectl rollout status deployment/user-service -n microservices --timeout=5m
          kubectl rollout status deployment/api-gateway -n microservices --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get pods -n microservices
          kubectl get services -n microservices
