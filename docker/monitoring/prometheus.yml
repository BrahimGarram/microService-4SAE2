# Prometheus — scrape minimal (local / Docker)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métriques de Prometheus lui-même (vérifie que le scraping fonctionne)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- Décommente et adapte quand tes apps Spring exposent /actuator/prometheus ---
  # (voir micrometer-registry-prometheus + management.endpoints.web.exposure.include=prometheus)
  #
  # Si la stack freelance tourne sur la machine hôte (ports mappés par docker-compose) :
  # - job_name: user-service
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:18081"]
  #
  # Si tout est sur le même réseau Docker Compose que ce fichier monitoring :
  # - job_name: user-service
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["user-service:8081"]
