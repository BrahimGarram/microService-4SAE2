spring:
  application:
    name: freelance-platform-spring-app

  datasource:
    url: jdbc:h2:mem:complaintsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Email Configuration (Gmail)
  mail:
    host: smtp.gmail.com
    port: 587
    username: cw.club102@gmail.com
    password: mejwmoqbngvmqkts
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Enable scheduling
  task:
    scheduling:
      enabled: true

  web:
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://localhost:8080"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8089
  servlet:
    context-path: /freelancity

app:
