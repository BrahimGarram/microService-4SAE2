# Docker Compose v2+ — pas de container_name : évite les conflits avec d'anciens conteneurs.
# Ports hôte : Eureka 18761, MySQL 3307, Keycloak 8180, user-service 18081, service-test 18089,
#             api-gateway 18090, frontend 4200

services:

  eureka-server:
    build: ./Eureka
    image: brahim2002/eureka:latest
    pull_policy: build
    ports:
      - "18761:8761"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"

  user-service:
    build: ./services/backend1
    image: brahim2002/user-service:latest
    pull_policy: build
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "18081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/freelance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  service-test:
    build: ./services/testService/service-test
    image: brahim2002/service-test:latest
    pull_policy: build
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "18089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/freelancify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      USER_SERVICE_URL: http://user-service:8081

  api-gateway:
    build: ./ApiGateway4sae2
    image: brahim2002/api-gateway:latest
    pull_policy: build
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_healthy
      service-test:
        condition: service_started
    ports:
      - "18090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      # Routage HTTP direct (réseau Compose) : évite les 503 lb:// si Eureka est lent ou vide.
      GATEWAY_USER_SERVICE_URI: http://user-service:8081
      GATEWAY_SERVICE_TEST_URI: http://service-test:8089

  frontend:
    build: ./frontend
    image: brahim2002/frontend:latest
    pull_policy: build
    depends_on:
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "4200:80"

volumes:
  mysql-data:
