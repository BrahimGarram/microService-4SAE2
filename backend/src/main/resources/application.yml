spring:
  application:
    name: user-service
  
  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Keycloak OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak JWT Issuer URI
          # Replace with your Keycloak server URL
          issuer-uri: http://localhost:8180/realms/projetpidev
          # JWT validation settings
          jwk-set-uri: http://localhost:8180/realms/projetpidev/protocol/openid-connect/certs
  
  # Email Configuration (for password reset)
  mail:
    host: smtp.gmail.com
    port: 587
    username: sahem.index@gmail.com
    password: qwfzcavugntkgdev
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server Configuration
server:
  port: 8081  # Changed to 8081 to avoid conflict with Keycloak (port 8080)

# Keycloak Admin Configuration (for user registration)
keycloak:
  admin:
    url: http://localhost:8180
    username: admin
    password: admin
    realm: projetpidev

# Application Configuration
app:
  frontend:
    url: http://localhost:4200
  mail:
    from: sahem.index@gmail.com
    from-name: Freelancify
  upload:
    dir: uploads
  base:
    url: http://localhost:8081

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.freelance: DEBUG
