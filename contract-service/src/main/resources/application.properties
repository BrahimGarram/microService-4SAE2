server.port=8083

spring.application.name=contract-service

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:contractdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Jackson - serialize LocalDate as string
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Stripe
stripe.api.key=${STRIPE_SECRET_KEY:sk_test_REPLACE_WITH_YOUR_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_WITH_YOUR_SECRET}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_REPLACE_WITH_YOUR_PUBLIC_KEY}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Feign
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
